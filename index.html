<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AV BOX - Login & Pendaftaran</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
  <div class="container py-5">
    
    <!-- ================= FORM LOGIN ================= -->
    <div class="row justify-content-center" id="view-login">
      <div class="col-md-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h2 class="text-center text-danger fw-bold fst-italic mb-1">AV BOX</h2>
            <p class="text-center text-muted mb-4">Portal Member & Kasir</p>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label fw-bold">ID / Nama / No. WhatsApp</label>
                <input type="text" id="logIdentitas" class="form-control" placeholder="Masukkan ID / Nama / WA" required>
              </div>
              <div class="mb-4">
                <label class="form-label fw-bold">Password</label>
                <input type="password" id="logPass" class="form-control" required>
              </div>
              <button type="submit" class="btn btn-danger w-100 fw-bold">Masuk</button>
            </form>
            <div class="text-center mt-3">
              <small>Belum punya akun? <a href="#" class="text-danger fw-bold text-decoration-none" onclick="toggleView('view-register')">Daftar Member Baru</a></small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= FORM REGISTER ================= -->
    <div class="row justify-content-center d-none" id="view-register">
      <div class="col-md-6">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h3 class="fw-bold mb-4 text-center">Registrasi Member</h3>
            <form id="regForm">
              <!-- Upload Foto -->
              <div class="mb-3 text-center">
                <label class="form-label fw-bold w-100">Pas Foto Profil</label>
                <input type="file" id="regPhoto" class="form-control form-control-sm mx-auto" accept="image/*" required style="max-width: 250px;">
                <small class="text-muted d-block mt-1">Foto ini akan dicetak di kartu digital.</small>
              </div>
              <!-- Input Keamanan -->
              <div class="mb-3">
                <label class="form-label fw-bold">Nama Lengkap (Maks 30 Huruf)</label>
                <input type="text" id="regName" class="form-control" maxlength="30" required>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">No. WhatsApp</label>
                <input type="text" id="regPhone" class="form-control" minlength="8" maxlength="13" placeholder="Contoh: 0812..." required>
              </div>
              <div class="mb-4">
                <label class="form-label fw-bold">Buat Password</label>
                <input type="password" id="regPass" class="form-control" minlength="8" required>
              </div>
              <button type="submit" id="btnDaftar" class="btn btn-danger w-100 fw-bold">Daftar & Proses Kartu</button>
            </form>
            <div class="text-center mt-3">
              <button class="btn btn-link text-danger text-decoration-none" onclick="toggleView('view-login')">Kembali ke Login</button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
